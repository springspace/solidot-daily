name: Generate Daily Solidot RSS

on:
  schedule:
    - cron: '0 14 * * *'  # UTC 时间 14:00，等于北京时间每天晚上 22:00
  workflow_dispatch:      # 允许我们手动点击按钮立即触发测试

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install feedparser feedgen

    - name: 4. 执行 Python 合并脚本
      run: python digest.py

    - name: 5. 将生成的 RSS 文件提交并推送到仓库
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 检查是否有文件更新，防止没有新新闻时报错
        if [ -f "solidot_daily.xml" ]; then
          git add solidot_daily.xml
          git commit -m "自动更新: Solidot 每日简报" || echo "没有新内容需要提交"
          git push
        fi
