name: Generate Daily Solidot RSS

on:
  schedule:
    - cron: '0 09 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. 原生命令拉取代码
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        
    - name: 2. 安装依赖并执行 Python 脚本
      run: |
        python3 -m pip install --user feedparser feedgen
        python3 digest.py

    - name: 3. 提交并推送到仓库
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if [ -f "solidot_daily.xml" ]; then
          git add solidot_daily.xml
          git commit -m "自动更新: Solidot 每日简报" || echo "没有新内容"
          # 使用内置的 GITHUB_TOKEN 确保推送权限，完全不依赖外部组件
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
        fi
