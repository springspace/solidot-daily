name: Generate Daily Solidot RSS

on:
  schedule:
    - cron: '0 14 * * *'  # 北京时间每天晚上 22:00
  workflow_dispatch:      # 允许手动点击触发

# 在最顶层注入环境变量，强制所有后续步骤和插件全部使用 Node.js 24 运行
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. 下载仓库代码
      uses: actions/checkout@v4

    - name: 2. 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install feedparser feedgen

    - name: 4. 执行 Python 合并脚本
      run: python digest.py

    - name: 5. 将生成的 RSS 文件提交并推送到仓库
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if [ -f "solidot_daily.xml" ]; then
          git add solidot_daily.xml
          git commit -m "自动更新: Solidot 每日简报" || echo "没有新内容需要提交"
          git push
        fi
